<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" width="180" height="180">
  <rect width="180" height="180" rx="36" fill="#0f172a"/>
  <!-- Red arrow: upper-left → lower-right (SELL) -->
  <g transform="rotate(135, 90, 90)">
    <polygon points="90,18 130,60 110,60 110,162 70,162 70,60 50,60" fill="#EF4444"/>
  </g>
  <!-- Green arrow: lower-left → upper-right (BUY) -->
  <g transform="rotate(45, 90, 90)">
    <polygon points="90,18 130,60 110,60 110,162 70,162 70,60 50,60" fill="#22C55E"/>
  </g>
</svg>