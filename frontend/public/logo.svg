<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="greenArrow" gradientUnits="userSpaceOnUse" x1="100" y1="460" x2="430" y2="50">
      <stop offset="0%" stop-color="#15803d"/>
      <stop offset="50%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#4ade80"/>
    </linearGradient>
    <linearGradient id="redArrow" gradientUnits="userSpaceOnUse" x1="100" y1="50" x2="430" y2="460">
      <stop offset="0%" stop-color="#fca5a5"/>
      <stop offset="50%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
  </defs>

  <!-- Red arrow: upper-left → lower-right (SELL) - drawn first (behind) -->
  <g transform="rotate(135, 256, 256)">
    <polygon points="256,42 376,222 304,222 304,470 208,470 208,222 136,222" fill="url(#redArrow)"/>
  </g>

  <!-- Green arrow: lower-left → upper-right (BUY) - drawn second (in front) -->
  <g transform="rotate(45, 256, 256)">
    <polygon points="256,42 376,222 304,222 304,470 208,470 208,222 136,222" fill="url(#greenArrow)"/>
  </g>
</svg>