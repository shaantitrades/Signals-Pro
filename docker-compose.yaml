version: '3.8'

services:
  # ─── PostgreSQL (auto-hébergé, remplace Supabase) ─────────
  postgres:
    image: timescale/timescaledb:latest-pg16
    restart: always
    command: postgres -c shared_buffers=128MB -c max_connections=40 -c work_mem=4MB -c maintenance_work_mem=32MB -c effective_cache_size=256MB
    mem_limit: 400m
    mem_reservation: 200m
    cpus: 0.5
    environment:
      POSTGRES_DB: signalspro
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-Rk7Xm9Pq2Wv5Nj8Hs4Lf6Gc3Yd1Tb0Za}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d signalspro"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ─── Redis ────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD:-7KHw8mN2pXvR9qZbY5tL3jF6gC4hD1sA} --maxmemory 80mb --maxmemory-policy allkeys-lru
    mem_limit: 100m
    cpus: 0.3
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-7KHw8mN2pXvR9qZbY5tL3jF6gC4hD1sA}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ─── Signal Engine (démarre en premier) ───────────────────
  signal-engine:
    build:
      context: ./signal-engine
      dockerfile: Dockerfile
    restart: always
    mem_limit: 450m
    cpus: 0.5
    environment:
      DATABASE_URL_ASYNC: postgresql+asyncpg://postgres:${DB_PASSWORD:-Rk7Xm9Pq2Wv5Nj8Hs4Lf6Gc3Yd1Tb0Za}@postgres:5432/signalspro
      REDIS_URL: redis://:${REDIS_PASSWORD:-7KHw8mN2pXvR9qZbY5tL3jF6gC4hD1sA}@redis:6379
      API_URL: http://backend:3001/api
      API_KEY: ${ENGINE_API_KEY:-a7f3e9c2b1d8f4a6e5c9b7d3f2a8e6c4b9d7f3a5e2c8b6d4f9a7e3c1b5d8f4a2}
      SIGNAL_MIN_CONFIDENCE: ${SIGNAL_MIN_CONFIDENCE:-85}
      ANALYSIS_INTERVAL_SECONDS: ${ANALYSIS_INTERVAL_SECONDS:-30}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "8888:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 25s

  # ─── Backend API ──────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    mem_limit: 300m
    cpus: 0.5
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: production
      NODE_OPTIONS: --max-old-space-size=220
      PORT: 3001
      DATABASE_URL: postgresql://postgres:${DB_PASSWORD:-Rk7Xm9Pq2Wv5Nj8Hs4Lf6Gc3Yd1Tb0Za}@postgres:5432/signalspro
      REDIS_URL: redis://:${REDIS_PASSWORD:-7KHw8mN2pXvR9qZbY5tL3jF6gC4hD1sA}@redis:6379
      JWT_SECRET: ${JWT_SECRET:-xK8mP3vN9qR2wL5jY7tF4hG6bZ1cX0sA8dE3wQ9mN5kJ7pL2yT6vR4hG9bF3xM1c}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-bT9mK5wP2xL8jN4qR7vH3cY6fG1zS0dA5eW9mQ8kJ3pL7yT2vR6hG4bF8xM0cN5j}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-sk_test_placeholder}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-whsec_placeholder}
      FRONTEND_URL: ${FRONTEND_URL:-https://marketsignals24.com}
      API_URL: ${API_URL:-https://api.marketsignals24.com/api}
      SIGNAL_ENGINE_URL: http://signal-engine:8000
      ENGINE_API_KEY: ${ENGINE_API_KEY:-a7f3e9c2b1d8f4a6e5c9b7d3f2a8e6c4b9d7f3a5e2c8b6d4f9a7e3c1b5d8f4a2}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-857941292927-3os76q6dq4f6nkvnoqh4kbcule2gk777.apps.googleusercontent.com}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      NOWPAYMENTS_API_KEY: ${NOWPAYMENTS_API_KEY:-}
      NOWPAYMENTS_IPN_SECRET: ${NOWPAYMENTS_IPN_SECRET:-}
      PAYPAL_ENVIRONMENT: ${PAYPAL_ENVIRONMENT:-production}
      PAYPAL_CLIENT_ID: ${PAYPAL_CLIENT_ID:-}
      PAYPAL_CLIENT_SECRET: ${PAYPAL_CLIENT_SECRET:-}
      PAYPAL_WEBHOOK_ID: ${PAYPAL_WEBHOOK_ID:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      signal-engine:
        condition: service_healthy

  # ─── Frontend ─────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://api.marketsignals24.com}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-wss://api.marketsignals24.com}
        NEXT_PUBLIC_SIGNAL_ENGINE_URL: ${NEXT_PUBLIC_SIGNAL_ENGINE_URL:-https://api.marketsignals24.com}
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-857941292927-3os76q6dq4f6nkvnoqh4kbcule2gk777.apps.googleusercontent.com}
    restart: always
    mem_limit: 300m
    cpus: 0.5
    ports:
      - "3000:3000"
    environment:
      NODE_OPTIONS: --max-old-space-size=220
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://api.marketsignals24.com}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-wss://api.marketsignals24.com}
      NEXT_PUBLIC_SIGNAL_ENGINE_URL: ${NEXT_PUBLIC_SIGNAL_ENGINE_URL:-https://api.marketsignals24.com}
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-857941292927-3os76q6dq4f6nkvnoqh4kbcule2gk777.apps.googleusercontent.com}
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data: